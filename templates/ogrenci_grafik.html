<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Öğrenci Gelişim Grafiği</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 800px;">
        <a href="{{ url_for('ana_sayfa') }}" class="btn btn-secondary mb-3">⬅️ Panele Dön</a>
        
        <div class="card p-4 shadow-sm">
            <h3 class="mb-4 text-center text-primary">📊 {{ ogrenci[0] }} - Gelişim Analizi</h3>

            {% if grafik_var %}
                <div class="text-center">
                    <img src="{{ url_for('static', filename=grafik_dosya) }}" alt="Gelişim Grafiği" class="img-fluid rounded border">
                </div>
            {% else %}
                <div class="alert alert-warning text-center">
                    Bu öğrenci henüz sisteme herhangi bir antrenman ağırlık verisi girmemiş.
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
